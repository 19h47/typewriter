<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="Une machine à écrire minimaliste dans le navigateur."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <title>Typewriter</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="app-style.css" />
    <style>
      /* What Typewriter adds to app-style.css, the base shared by the small apps */

      @layer app {
        :root {
          --typewriter-u4: calc(var(--app-phi) * var(--app-u3));
          /* Horizontal rhythm from φ, around the page */
          --typewriter-margin: var(--app-space-xl);

          --typewriter-z-shortcuts: 1;
          --typewriter-z-controls: 2;

          --typewriter-transition-2: calc(var(--app-transition-1) * var(--app-phi));
        }

        .typewriter-app {
          height: 100dvh;
          padding: 0 var(--typewriter-margin);
          display: flex;
          flex-direction: column;
          align-items: center;
          overflow: hidden;
        }

        .typewriter-page {
          width: 100%;
          max-width: var(--app-max-width);
          flex: 1;
          min-height: 0;
          display: flex;
          flex-direction: column;
        }

        typewriter-editor {
          position: relative;
          display: block;
          flex: 1;
          min-height: 0;
          overflow: auto;
          outline: none;
          padding-block: var(--app-space-xl);
          white-space: pre-wrap;
          overflow-wrap: anywhere;
          scrollbar-width: none;
        }

        typewriter-editor:focus-visible {
          outline: none;
        }

        /* Absolutely positioned so the caret is not pushed after it */
        typewriter-editor:state(empty)::before {
          position: absolute;
          content: attr(aria-placeholder);
          color: var(--app-text-muted);
          pointer-events: none;
        }

        /* Under the editor, which scrolls: the footer keeps its height */
        .app-footer {
          flex-shrink: 0;
        }

        typewriter-shortcuts {
          position: fixed;
          right: 0;
          bottom: 0;
          z-index: var(--typewriter-z-shortcuts);
        }

        .typewriter-shortcuts__hotzone {
          display: block;
          /* The font of the page, not the one of a button */
          font: inherit;
          width: var(--app-u3);
          height: var(--app-u3);
          border: none;
          background: transparent;
          cursor: pointer;
          appearance: none;
        }

        /* A popover panel, sliding in from --typewriter-panel-shift */
        .typewriter-panel {
          margin: 0;
          padding: var(--app-space-l);
          /* Three steps above --typewriter-u4 */
          max-width: calc(var(--typewriter-u4) * var(--app-phi) * var(--app-phi) * var(--app-phi));
          border: 1px solid var(--app-line-soft);
          border-radius: var(--app-radius-m);
          background: var(--app-bg);
          color: var(--app-text);
          font-family: var(--app-font-ui);
          font-size: var(--app-text-s);
          opacity: 0;
          translate: 0 var(--typewriter-panel-shift);
          transition:
            opacity var(--app-transition-1),
            translate var(--app-transition-1),
            display var(--app-transition-1) allow-discrete,
            overlay var(--app-transition-1) allow-discrete;
        }

        .typewriter-panel:popover-open {
          opacity: 1;
          translate: 0 0;

          @starting-style {
            opacity: 0;
            translate: 0 var(--typewriter-panel-shift);
          }
        }

        .typewriter-panel__title {
          font-weight: 600;
          margin-bottom: var(--app-space-s);
          color: var(--app-text-muted);
        }

        /* Reset the UA popover centering, anchor bottom-right */
        .typewriter-shortcuts__panel {
          --typewriter-panel-shift: var(--app-u0);

          inset: auto var(--app-space-l) var(--app-space-l) auto;
        }

        .typewriter-shortcuts__table {
          width: 100%;
          border-collapse: collapse;
        }

        .typewriter-shortcuts__table td {
          padding-top: var(--app-space-m);
          vertical-align: baseline;
        }

        .typewriter-shortcuts__table tr:first-child td {
          padding-top: 0;
        }

        .typewriter-shortcuts__keys {
          padding-right: var(--app-space-l);
          white-space: nowrap;
        }

        .typewriter-shortcuts__table kbd {
          font-family: var(--app-font-mono);
          font-size: var(--app-text-s);
          padding: calc(1em / var(--app-phi) / var(--app-phi) / var(--app-phi)) var(--app-space-s);
          border-radius: var(--app-radius-m);
          border: 1px solid var(--app-line);
        }

        /* Under the toolbar, against its right edge, as wide as it may be */
        .typewriter-documents__panel {
          --typewriter-panel-top: calc(var(--app-toolbar-top) + var(--app-control-size) + var(--app-space-s));
          --typewriter-panel-shift: calc(-1 * var(--app-u0));

          inset: var(--typewriter-panel-top) var(--app-space-l) auto auto;
          width: 100%;
          max-width: min(
            calc(var(--typewriter-u4) * var(--app-phi) * var(--app-phi) * var(--app-phi)),
            calc(100% - 2 * var(--app-space-l))
          );
          max-height: calc(100% - var(--typewriter-panel-top) - var(--app-space-l));
          overflow-y: auto;
        }

        .typewriter-documents__title {
          display: flex;
          justify-content: space-between;
          gap: var(--app-space-xs);
        }

        .typewriter-documents__count {
          font-weight: normal;
        }

        .typewriter-documents__list {
          list-style: none;
          margin-top: var(--app-space-s);
          display: grid;
          gap: var(--app-space-xs);
        }

        .typewriter-documents__item {
          display: flex;
          gap: var(--app-space-xs);
        }

        .typewriter-documents__new,
        .typewriter-documents__open,
        .typewriter-documents__remove {
          padding: var(--app-space-s);
          border: 1px solid transparent;
          border-radius: var(--app-radius-m);
          background: transparent;
          color: var(--app-text-muted);
          font: inherit;
          text-align: start;
          cursor: pointer;
          transition:
            color var(--app-transition-1),
            background-color var(--app-transition-1);
        }

        .typewriter-documents__new {
          width: 100%;
          border-color: var(--app-line-soft);
        }

        .typewriter-documents__open {
          flex: 1;
          min-width: 0;
          display: grid;
        }

        :is(
          .typewriter-documents__new,
          .typewriter-documents__open,
          .typewriter-documents__remove
        ):is(:hover, :focus-visible) {
          background: var(--app-fill);
          color: var(--app-text);
        }

        /* The text open stands out as a pressed control does */
        .typewriter-documents__open[aria-current="true"] {
          border-color: var(--app-line);
          background: var(--app-fill);
          color: var(--app-text);
        }

        .typewriter-documents__name {
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .typewriter-documents__meta {
          color: var(--app-text-muted);
        }

        /* Above the shortcuts */
        .app-toolbar {
          z-index: var(--typewriter-z-controls);
        }

        /* Distraction-free: hide the UI (kept out of tab order), keep the footer rule */
        .app-footer > *,
        typewriter-shortcuts,
        typewriter-documents,
        typewriter-export,
        typewriter-theme-toggle {
          transition:
            opacity var(--typewriter-transition-2),
            visibility var(--typewriter-transition-2);
        }

        :root[data-distraction-free] {
          .app-footer > *,
          typewriter-shortcuts,
          typewriter-documents,
          typewriter-export,
          typewriter-theme-toggle {
            opacity: 0;
            visibility: hidden;
          }
        }

        @media print {
          @page {
            margin: 2.5cm;
          }

          html,
          body {
            background: rgb(255, 255, 255);
            color: rgb(0, 0, 0);
            print-color-adjust: exact;
          }

          .typewriter-app {
            height: auto;
            padding: 0;
            overflow: visible;
          }

          .typewriter-page {
            max-width: none;
            flex: none;
          }

          typewriter-editor {
            flex: none;
            overflow: visible;
            padding-block: 0;
            font-size: 12pt;
          }

          typewriter-editor:state(empty)::before {
            content: none;
          }

          .app-footer,
          typewriter-shortcuts,
          .app-toolbar {
            display: none !important;
          }
        }
      }
    </style>
    <script>
      "use strict";

      // The store lives on window and is created before the first paint:
      // the document takes its theme from it, without a flash of the wrong
      // one. The block keeps everything else out of the global scope.
      {
        const STORAGE_KEY = "typewriter-store";
        const TEXT_KEY_PREFIX = "typewriter-text:";
        const SAVE_DEBOUNCE_MS = 400;

        const $root = document.documentElement;
        const $themeColor = document.querySelector('meta[name="theme-color"]');
        const $favicon = document.querySelector('link[rel="icon"]');
        const darkQuery = matchMedia("(prefers-color-scheme: dark)");

        /** Observable state: the part of @agencecinq/store used here. */
        class Store {
          #state;
          #listeners = new Set();

          constructor(initial) {
            this.#state = initial;
          }

          get() {
            return this.#state;
          }

          /** A function is called with the current state and returns the next one. */
          set(update) {
            const previous = this.#state;
            const next =
              typeof update === "function" ? update(previous) : update;

            if (Object.is(next, previous)) return;

            this.#state = next;
            this.#listeners.forEach(listener => {
              try {
                listener(next, previous);
              } catch (error) {
                reportError(error);
              }
            });
          }

          /** Called on every change, not right away. Returns the unsubscribe function. */
          subscribe(listener) {
            this.#listeners.add(listener);

            return () => {
              this.#listeners.delete(listener);
            };
          }

          /**
           * Called right away with the selected slice, then only when it
           * changes. Returns the unsubscribe function.
           */
          select(selector, listener) {
            let value = selector(this.#state);

            listener(value);

            return this.subscribe(state => {
              const next = selector(state);

              if (Object.is(next, value)) return;

              value = next;
              listener(next);
            });
          }
        }

        /** The preferences localStorage holds, checked: anything else falls back. */
        function loadPreferences() {
          let saved = null;
          try {
            saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          } catch {}
          const theme = ["light", "dark"].includes(saved?.theme)
            ? saved.theme
            : null;
          return {
            // The theme shown, and whether it was chosen over the system one.
            theme: theme ?? (darkQuery.matches ? "dark" : "light"),
            themeChosen: theme !== null,
            distractionFree: saved?.distractionFree === true,
            // The text open last, in any tab.
            current: typeof saved?.current === "string" ? saved.current : null,
          };
        }

        /** A text as localStorage holds it, checked: null for anything else. */
        function parseText(value) {
          let saved = null;
          try {
            saved = JSON.parse(value);
          } catch {}
          if (
            typeof saved?.text !== "string" ||
            !Number.isFinite(saved.updatedAt)
          ) {
            return null;
          }
          return { text: saved.text, updatedAt: saved.updatedAt };
        }

        /** Every text localStorage holds, by id. */
        function loadTexts() {
          const texts = new Map();
          try {
            for (let index = 0; index < localStorage.length; index++) {
              const key = localStorage.key(index);
              if (!key.startsWith(TEXT_KEY_PREFIX)) continue;
              const text = parseText(localStorage.getItem(key));
              if (text) texts.set(key.slice(TEXT_KEY_PREFIX.length), text);
            }
          } catch {}
          return texts;
        }

        /** A blank text is not kept: nothing to find in the list. */
        function isBlank(text) {
          return text.trim() === "";
        }

        function createText() {
          return { text: "", updatedAt: Date.now() };
        }

        /** Opens `current`, else the text written last, else a new blank one. */
        function withCurrent(texts, current) {
          if (texts.has(current)) return { texts, current };
          const [latest] = [...texts].sort(
            ([, a], [, b]) => b.updatedAt - a.updatedAt,
          );
          if (latest) return { texts, current: latest[0] };
          const id = Date.now().toString(36);
          return { texts: new Map(texts).set(id, createText()), current: id };
        }

        /**
         * The page state. Every brick reads and writes it, none knows the
         * others. `texts` holds every text by id, `current` the id of the
         * one open. `saved` is false while a change waits for localStorage.
         * `lastSave` is a new object on every save, so that two saves in a
         * row both notify, and tells whether the user asked for it and the
         * error that kept it from localStorage, if any.
         */
        class TypewriterStore extends Store {
          #saveTimeout = null;
          #persistRequested = false;

          constructor() {
            const { current, ...preferences } = loadPreferences();
            super({
              ...preferences,
              ...withCurrent(loadTexts(), current),
              saved: true,
              lastSave: null,
            });

            darkQuery.addEventListener("change", ({ matches }) => {
              this.set(state =>
                state.themeChosen
                  ? state
                  : { ...state, theme: matches ? "dark" : "light" },
              );
            });

            // Never lose the last keystrokes when the tab is closed or hidden.
            addEventListener("pagehide", () => this.#write(false));
            document.addEventListener("visibilitychange", () => {
              if (document.visibilityState === "hidden") this.#write(false);
            });

            addEventListener("storage", ({ key, newValue }) => {
              if (key === STORAGE_KEY) {
                this.#followPreferences();
              } else if (key?.startsWith(TEXT_KEY_PREFIX)) {
                const id = key.slice(TEXT_KEY_PREFIX.length);
                this.#followText(id, parseText(newValue));
              }
            });
          }

          setText(text) {
            const { texts, current } = this.get();
            const updatedAt = Date.now();
            this.#change({
              texts: new Map(texts).set(current, { text, updatedAt }),
            });
          }

          /** Opens a new blank text, unless the one open is blank already. */
          create() {
            const { texts, current } = this.get();
            if (isBlank(texts.get(current).text)) return;
            this.#write(false);
            const id = Date.now().toString(36);
            this.#change({
              texts: new Map(texts).set(id, createText()),
              current: id,
            });
          }

          open(id) {
            const { texts, current } = this.get();
            if (id === current || !texts.has(id)) return;
            this.#write(false);
            const next = new Map(texts);
            if (isBlank(texts.get(current).text)) next.delete(current);
            this.#change({ texts: next, current: id });
          }

          /** Removing the text open opens the one written last. */
          remove(id) {
            const { texts, current } = this.get();
            if (!texts.has(id)) return;
            try {
              localStorage.removeItem(TEXT_KEY_PREFIX + id);
            } catch {}
            const next = new Map(texts);
            next.delete(id);
            this.#change(withCurrent(next, id === current ? null : current));
          }

          toggleTheme() {
            const theme = this.get().theme === "dark" ? "light" : "dark";
            this.#change({ theme, themeChosen: true });
          }

          /** Like toggleAttribute(): `force` sets the mode instead. */
          toggleDistractionFree(force = !this.get().distractionFree) {
            this.#change({ distractionFree: force });
          }

          /** The user asks to save: written now, confirmed even with nothing pending. */
          save() {
            this.#write(true);
          }

          // Another tab saved its preferences: follow them, unless this one
          // has changes of its own waiting to be saved. Each tab keeps the
          // text it has open.
          #followPreferences() {
            if (!this.get().saved) return;
            const { current, ...preferences } = loadPreferences();
            this.set(state => ({ ...state, ...preferences }));
          }

          // Another tab saved a text: follow it, unless it is the one open
          // here with changes waiting. The one open here, removed there, is
          // left blank.
          #followText(id, text) {
            const state = this.get();
            if (id === state.current && !state.saved) return;
            const texts = new Map(state.texts);
            if (text) texts.set(id, text);
            else if (id === state.current) texts.set(id, createText());
            else texts.delete(id);
            this.set({ ...state, texts });
          }

          #write(manual) {
            clearTimeout(this.#saveTimeout);
            const { texts, current, theme, themeChosen, distractionFree, saved } =
              this.get();
            if (saved && !manual) return;
            if (!saved) {
              const { text, updatedAt } = texts.get(current);
              const key = TEXT_KEY_PREFIX + current;
              try {
                if (isBlank(text)) localStorage.removeItem(key);
                else localStorage.setItem(key, JSON.stringify({ text, updatedAt }));
                localStorage.setItem(
                  STORAGE_KEY,
                  JSON.stringify({
                    current,
                    theme: themeChosen ? theme : null,
                    distractionFree,
                  }),
                );
              } catch (error) {
                this.set(state => ({ ...state, lastSave: { manual, error } }));
                return;
              }
              this.#persist();
            }
            this.set(state => ({
              ...state,
              saved: true,
              lastSave: { manual, error: null },
            }));
          }

          /**
           * Asks once that the browser keep the texts, rather than clear
           * them when the device runs out of room.
           */
          #persist() {
            if (this.#persistRequested) return;
            this.#persistRequested = true;
            navigator.storage?.persist().catch(() => {});
          }

          #change(patch) {
            const state = this.get();
            if (Object.keys(patch).every(key => state[key] === patch[key])) {
              return;
            }
            this.set({ ...state, ...patch, saved: false });
            clearTimeout(this.#saveTimeout);
            this.#saveTimeout = setTimeout(
              () => this.#write(false),
              SAVE_DEBOUNCE_MS,
            );
          }
        }

        const store = new TypewriterStore();

        // The document follows the store: CSS reads these attributes.
        store.select(
          state => state.theme,
          theme => {
            $root.dataset.theme = theme;
            $themeColor.content = getComputedStyle($root).backgroundColor;
            $favicon.href =
              theme === "dark" ? "favicon-dark.svg" : "favicon.svg";
          },
        );
        store.select(
          state => state.distractionFree,
          distractionFree => {
            $root.toggleAttribute("data-distraction-free", distractionFree);
          },
        );

        window.store = store;
      }
    </script>
  </head>
  <body>
    <div class="typewriter-app">
      <main class="typewriter-page">
        <typewriter-editor
          aria-placeholder="Commencez à écrire…"
          role="textbox"
          aria-multiline="true"
          aria-label="Zone d’écriture"
        ></typewriter-editor>
        <footer class="app-footer">
          <typewriter-word-count>0 mot</typewriter-word-count>
          <typewriter-save-status>
            <span aria-hidden="true"></span>
            <span class="sr-only" role="status"></span>
          </typewriter-save-status>
        </footer>
      </main>
    </div>

    <typewriter-shortcuts>
      <button
        type="button"
        class="typewriter-shortcuts__hotzone"
        aria-label="Raccourcis clavier"
        popovertarget="typewriter-shortcuts-panel"
        popovertargetaction="show"
      ></button>
      <div
        class="typewriter-panel typewriter-shortcuts__panel"
        id="typewriter-shortcuts-panel"
        popover
      >
        <div class="typewriter-panel__title">Raccourcis</div>
        <table class="typewriter-shortcuts__table">
          <caption class="sr-only">
            Liste des raccourcis clavier
          </caption>
          <thead>
            <tr>
              <th scope="col" class="sr-only">Raccourci</th>
              <th scope="col" class="sr-only">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="typewriter-shortcuts__keys">
                <kbd class="js-typewriter-mod">Ctrl</kbd> + <kbd>S</kbd>
              </td>
              <td>Enregistrer</td>
            </tr>
            <tr>
              <td class="typewriter-shortcuts__keys">
                <kbd class="js-typewriter-mod">Ctrl</kbd> + <kbd>K</kbd>
              </td>
              <td>Thème clair/sombre</td>
            </tr>
            <tr>
              <td class="typewriter-shortcuts__keys"><kbd>Échap</kbd></td>
              <td>Quitter le mode sans distraction</td>
            </tr>
          </tbody>
        </table>
      </div>
    </typewriter-shortcuts>

    <div class="app-toolbar">
      <typewriter-documents>
        <button
          class="app-control"
          type="button"
          aria-label="Textes"
          title="Textes"
          popovertarget="typewriter-documents-panel"
        >
          ≡
        </button>
        <div
          class="typewriter-panel typewriter-documents__panel"
          id="typewriter-documents-panel"
          popover
        >
          <div class="typewriter-panel__title typewriter-documents__title">
            Textes
            <span class="typewriter-documents__count"></span>
          </div>
          <button type="button" class="typewriter-documents__new">
            Nouveau texte
          </button>
          <ul class="typewriter-documents__list"></ul>
          <template>
            <li class="typewriter-documents__item">
              <button type="button" class="typewriter-documents__open">
                <span class="typewriter-documents__name"></span>
                <span class="typewriter-documents__meta">
                  <time class="typewriter-documents__date"></time> ·
                  <span class="typewriter-documents__words"></span>
                </span>
              </button>
              <button
                type="button"
                class="typewriter-documents__remove"
                title="Supprimer"
              >
                ×
              </button>
            </li>
          </template>
        </div>
      </typewriter-documents>
      <typewriter-export>
        <a
          class="app-control"
          href="#"
          download="typewriter.txt"
          aria-label="Exporter en .txt"
          title="Exporter en .txt"
          >⤓</a
        >
      </typewriter-export>
      <typewriter-theme-toggle>
        <button
          class="app-control"
          type="button"
          aria-label="Thème sombre"
          title="Thème clair/sombre"
        ></button>
      </typewriter-theme-toggle>
      <typewriter-distraction-free-toggle>
        <button
          class="app-control"
          type="button"
          aria-label="Mode sans distraction"
          title="Mode sans distraction (Échap pour quitter)"
        >
          ⊙
        </button>
      </typewriter-distraction-free-toggle>
    </div>

    <script type="module">
      const { store } = window;

      const WORD_COUNT_DEBOUNCE_MS = 400;
      const SAVE_STATUS_HIDE_DELAY_MS = 1200;
      const SHORTCUTS_HIDE_DELAY_MS = 150;
      const SCROLL_AT_BOTTOM_THRESHOLD_PX = 10;
      const FILE_NAME_MAX_LENGTH = 60;

      const { lang } = document.documentElement;
      const isMac = /mac|iphone|ipad/i.test(
        navigator.userAgentData?.platform ?? navigator.platform,
      );
      const segmenter = new Intl.Segmenter(lang, { granularity: "word" });
      const pluralRules = new Intl.PluralRules(lang);
      const numberFormat = new Intl.NumberFormat(lang);
      const dateFormat = new Intl.DateTimeFormat(lang, {
        dateStyle: "medium",
        timeStyle: "short",
      });

      /** The text open. */
      function selectText({ texts, current }) {
        return texts.get(current).text;
      }

      /** The first line written, empty for a blank text. */
      function getTitle(text) {
        return text.trim().split("\n", 1)[0].trim();
      }

      function getWordCount(text) {
        let count = 0;
        for (const segment of segmenter.segment(text)) {
          if (segment.isWordLike) count++;
        }
        return count;
      }

      function formatWordCount(count) {
        // French: 0 and 1 are both "one" (0 mot, 1 mot, 2 mots).
        const word = pluralRules.select(count) === "one" ? "mot" : "mots";
        return `${numberFormat.format(count)} ${word}`;
      }

      /** Local date as YYYY-MM-DD. */
      function getLocalDate() {
        const date = new Date();
        return [date.getFullYear(), date.getMonth() + 1, date.getDate()]
          .map(n => String(n).padStart(2, "0"))
          .join("-");
      }

      class TypewriterEditorElement extends HTMLElement {
        #controller = null;
        #internals = this.attachInternals();
        #text = "";
        #wasAtBottom = true;

        connectedCallback() {
          this.contentEditable = "plaintext-only";
          this.spellcheck = true;
          this.#controller = new AbortController();
          const { signal } = this.#controller;

          this.addEventListener(
            "input",
            () => {
              this.#text = this.innerText;
              store.setText(this.#text);
              if (this.#wasAtBottom) this.scrollTop = this.scrollHeight;
            },
            { signal },
          );
          this.addEventListener(
            "scroll",
            () => {
              const maxScroll = this.scrollHeight - this.clientHeight;
              this.#wasAtBottom =
                this.scrollTop >= maxScroll - SCROLL_AT_BOTTOM_THRESHOLD_PX;
            },
            { signal },
          );

          // select() returns the unsubscribe function: abort() calls it.
          signal.addEventListener(
            "abort",
            store.select(selectText, text => {
              // The text this editor just wrote comes back as is: only
              // another text opened or another tab rewrites the DOM.
              if (text !== this.#text) {
                this.#text = text;
                this.textContent = text;
              }
              // Browsers may leave a lone <br> (read as "\n") once
              // everything is deleted.
              if (/^\n*$/.test(text)) this.#internals.states.add("empty");
              else this.#internals.states.delete("empty");
            }),
          );
          // Another text opened: write on at its end.
          signal.addEventListener(
            "abort",
            store.subscribe(({ current }, previous) => {
              if (current === previous.current) return;
              this.#wasAtBottom = true;
              this.scrollTop = this.scrollHeight;
              this.focus();
              getSelection().selectAllChildren(this);
              getSelection().collapseToEnd();
            }),
          );

          requestAnimationFrame(() => (this.scrollTop = this.scrollHeight));
        }

        disconnectedCallback() {
          this.#controller?.abort();
        }
      }
      customElements.define("typewriter-editor", TypewriterEditorElement);

      class TypewriterWordCountElement extends HTMLElement {
        #controller = null;
        #renderTimeout = null;

        connectedCallback() {
          this.#controller = new AbortController();
          const { signal } = this.#controller;
          this.#render(selectText(store.get()));
          signal.addEventListener(
            "abort",
            store.subscribe((state, previous) => {
              const text = selectText(state);
              if (text === selectText(previous)) return;
              // Counting walks the whole text: wait for a pause in the typing.
              clearTimeout(this.#renderTimeout);
              this.#renderTimeout = setTimeout(
                () => this.#render(text),
                WORD_COUNT_DEBOUNCE_MS,
              );
            }),
          );
        }

        disconnectedCallback() {
          this.#controller?.abort();
          clearTimeout(this.#renderTimeout);
        }

        #render(text) {
          this.textContent = formatWordCount(getWordCount(text));
        }
      }
      customElements.define(
        "typewriter-word-count",
        TypewriterWordCountElement,
      );

      class TypewriterSaveStatusElement extends HTMLElement {
        #controller = null;
        #hideTimeout = null;

        connectedCallback() {
          const $text = this.querySelector("[aria-hidden]");
          const $status = this.querySelector('[role="status"]');
          this.#controller = new AbortController();
          const { signal } = this.#controller;
          signal.addEventListener(
            "abort",
            store.subscribe(({ lastSave }, previous) => {
              if (lastSave === previous.lastSave) return;
              clearTimeout(this.#hideTimeout);
              // A failure stays, and is read aloud, until a save goes through.
              if (lastSave.error) {
                const message =
                  lastSave.error.name === "QuotaExceededError"
                    ? "Non enregistré : stockage plein"
                    : "Non enregistré";
                $text.textContent = message;
                $status.textContent = message;
                return;
              }
              $text.textContent = "Enregistré";
              // Every pause in the typing saves: only a save the user asked
              // for is read aloud.
              $status.textContent = lastSave.manual ? "Enregistré" : "";
              this.#hideTimeout = setTimeout(() => {
                $text.textContent = "";
                $status.textContent = "";
              }, SAVE_STATUS_HIDE_DELAY_MS);
            }),
          );
        }

        disconnectedCallback() {
          this.#controller?.abort();
          clearTimeout(this.#hideTimeout);
        }
      }
      customElements.define(
        "typewriter-save-status",
        TypewriterSaveStatusElement,
      );

      /** Lists the texts, the one written last first: opens, creates and removes them. */
      class TypewriterDocumentsElement extends HTMLElement {
        #controller = null;

        connectedCallback() {
          const $panel = this.querySelector("[popover]");
          const $new = this.querySelector(".typewriter-documents__new");
          const $count = this.querySelector(".typewriter-documents__count");
          const $list = this.querySelector(".typewriter-documents__list");
          const $template = this.querySelector("template");
          this.#controller = new AbortController();
          const { signal } = this.#controller;

          // Drawn only while open: the list follows every keystroke.
          const render = () => {
            const { texts, current } = store.get();
            const entries = [...texts]
              .sort(([, a], [, b]) => b.updatedAt - a.updatedAt)
              .map(([id, { text, updatedAt }]) => ({
                id,
                text,
                updatedAt,
                count: getWordCount(text),
              }));
            const total = entries.reduce((sum, { count }) => sum + count, 0);

            $count.textContent = formatWordCount(total);
            $list.replaceChildren(
              ...entries.map(({ id, text, updatedAt, count }) => {
                const $item = $template.content.firstElementChild.cloneNode(true);
                const $open = $item.querySelector(".typewriter-documents__open");
                const $name = $item.querySelector(".typewriter-documents__name");
                const $date = $item.querySelector(".typewriter-documents__date");
                const $words = $item.querySelector(".typewriter-documents__words");
                const $remove = $item.querySelector(
                  ".typewriter-documents__remove",
                );
                const title = getTitle(text) || "Sans titre";
                const date = new Date(updatedAt);

                $item.dataset.id = id;
                $name.textContent = title;
                $date.dateTime = date.toISOString();
                $date.textContent = dateFormat.format(date);
                $words.textContent = formatWordCount(count);
                if (id === current) $open.setAttribute("aria-current", "true");
                $remove.setAttribute("aria-label", `Supprimer « ${title} »`);
                return $item;
              }),
            );
          };

          $panel.addEventListener(
            "beforetoggle",
            ({ newState }) => {
              if (newState === "open") render();
            },
            { signal },
          );
          signal.addEventListener(
            "abort",
            store.subscribe(({ texts, current }, previous) => {
              if (texts === previous.texts && current === previous.current) {
                return;
              }
              if ($panel.matches(":popover-open")) render();
            }),
          );

          // Closed first: the focus it gives back to its button would
          // otherwise take the place of the editor's.
          $new.addEventListener(
            "click",
            () => {
              $panel.hidePopover();
              store.create();
            },
            { signal },
          );
          $list.addEventListener(
            "click",
            ({ target }) => {
              const $item = target.closest("li");
              if (!$item) return;
              const { id } = $item.dataset;
              if (target.closest(".typewriter-documents__open")) {
                $panel.hidePopover();
                store.open(id);
              } else if (target.closest(".typewriter-documents__remove")) {
                this.#remove($item, $panel, $new);
              }
            },
            { signal },
          );
        }

        disconnectedCallback() {
          this.#controller?.abort();
        }

        #remove($item, $panel, $new) {
          const { id } = $item.dataset;
          const { texts, current } = store.get();
          const title = getTitle(texts.get(id).text);
          // A blank text has nothing to lose.
          if (title && !confirm(`Supprimer « ${title} » ?`)) return;
          if (id === current) {
            $panel.hidePopover();
            store.remove(id);
            return;
          }
          // The focus goes to the text that takes its place in the list.
          const index = [...$item.parentElement.children].indexOf($item);
          store.remove(id);
          const $items = $panel.querySelectorAll(".typewriter-documents__open");
          ($items[Math.min(index, $items.length - 1)] ?? $new).focus();
        }
      }
      customElements.define("typewriter-documents", TypewriterDocumentsElement);

      /** Downloads the text open as a .txt file, named after its title and dated. */
      class TypewriterExportElement extends HTMLElement {
        #controller = null;
        #url = null;

        connectedCallback() {
          const $link = this.querySelector("a");
          this.#controller = new AbortController();
          const { signal } = this.#controller;
          // The href is filled in during the click, before the download starts.
          $link.addEventListener(
            "click",
            () => {
              const text = selectText(store.get());
              const blob = new Blob([text], {
                type: "text/plain;charset=utf-8",
              });
              // Without the characters a file name cannot hold.
              const name =
                getTitle(text)
                  .replace(/[\\/:*?"<>|]/g, "")
                  .slice(0, FILE_NAME_MAX_LENGTH)
                  .trim() || "typewriter";
              // Revoked on the next export, once the previous download is done.
              URL.revokeObjectURL(this.#url);
              this.#url = URL.createObjectURL(blob);
              $link.href = this.#url;
              $link.download = `${name}-${getLocalDate()}.txt`;
            },
            { signal },
          );
        }

        disconnectedCallback() {
          this.#controller?.abort();
          URL.revokeObjectURL(this.#url);
        }
      }
      customElements.define("typewriter-export", TypewriterExportElement);

      class TypewriterThemeToggleElement extends HTMLElement {
        #controller = null;

        connectedCallback() {
          const $button = this.querySelector("button");
          this.#controller = new AbortController();
          const { signal } = this.#controller;
          $button.addEventListener("click", () => store.toggleTheme(), {
            signal,
          });
          signal.addEventListener(
            "abort",
            store.select(
              state => state.theme,
              theme => {
                // U+FE0E forces text presentation (no emoji rendering).
                $button.textContent = theme === "dark" ? "☀︎" : "☽︎";
                $button.setAttribute("aria-pressed", String(theme === "dark"));
              },
            ),
          );
        }

        disconnectedCallback() {
          this.#controller?.abort();
        }
      }
      customElements.define(
        "typewriter-theme-toggle",
        TypewriterThemeToggleElement,
      );

      class TypewriterDistractionFreeToggleElement extends HTMLElement {
        #controller = null;

        connectedCallback() {
          const $button = this.querySelector("button");
          this.#controller = new AbortController();
          const { signal } = this.#controller;
          $button.addEventListener(
            "click",
            () => store.toggleDistractionFree(),
            { signal },
          );
          signal.addEventListener(
            "abort",
            store.select(
              state => state.distractionFree,
              distractionFree => {
                $button.setAttribute("aria-pressed", String(distractionFree));
              },
            ),
          );
        }

        disconnectedCallback() {
          this.#controller?.abort();
        }
      }
      customElements.define(
        "typewriter-distraction-free-toggle",
        TypewriterDistractionFreeToggleElement,
      );

      /** Lists the keyboard shortcuts, and handles them. */
      class TypewriterShortcutsElement extends HTMLElement {
        #controller = null;
        #hideTimeout = null;

        connectedCallback() {
          const $panel = this.querySelector("[popover]");

          for (const $mod of this.querySelectorAll(".js-typewriter-mod")) {
            $mod.textContent = isMac ? "⌘" : "Ctrl";
          }

          this.#controller = new AbortController();
          const { signal } = this.#controller;

          document.addEventListener(
            "keydown",
            e => {
              if (e.key === "Escape") {
                store.toggleDistractionFree(false);
                return;
              }
              const mod = isMac ? e.metaKey : e.ctrlKey;
              if (!mod || e.altKey || e.shiftKey) return;
              const key = e.key.toLowerCase();
              if (key === "s") {
                e.preventDefault();
                store.save();
              } else if (key === "k") {
                e.preventDefault();
                store.toggleTheme();
              }
            },
            { signal },
          );

          // Hover is a mouse-only enhancement; touch and keyboard use the
          // native popovertarget (closed by Escape or light dismiss).
          this.addEventListener(
            "pointerenter",
            e => {
              if (e.pointerType !== "mouse") return;
              clearTimeout(this.#hideTimeout);
              if (!$panel.matches(":popover-open")) $panel.showPopover();
            },
            { signal },
          );
          this.addEventListener(
            "pointerleave",
            e => {
              if (e.pointerType !== "mouse") return;
              this.#hideTimeout = setTimeout(() => {
                if ($panel.matches(":popover-open")) $panel.hidePopover();
              }, SHORTCUTS_HIDE_DELAY_MS);
            },
            { signal },
          );
        }

        disconnectedCallback() {
          this.#controller?.abort();
          clearTimeout(this.#hideTimeout);
        }
      }
      customElements.define("typewriter-shortcuts", TypewriterShortcutsElement);

      if (
        "serviceWorker" in navigator &&
        location.protocol.startsWith("http")
      ) {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      }
    </script>
  </body>
</html>
