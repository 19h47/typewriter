<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="Une machine à écrire minimaliste dans le navigateur."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <title>Typewriter</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      // Applied before first paint to avoid a flash of the wrong theme.
      try {
        const saved = JSON.parse(localStorage.getItem("typewriter-store"));
        const $root = document.documentElement;
        if (saved?.theme === "light" || saved?.theme === "dark") {
          $root.dataset.theme = saved.theme;
        }
        if (saved?.distractionFree) $root.dataset.distractionFree = "";
      } catch {}
    </script>
    <style>
      :root {
        color-scheme: light dark;

        /* Golden ratio (φ) and derived scale */
        --typewriter-phi: 1.618034;
        --typewriter-u0: calc(var(--typewriter-u1) / var(--typewriter-phi));
        --typewriter-u1: 1rem;
        --typewriter-u2: calc(var(--typewriter-phi) * var(--typewriter-u1));
        --typewriter-u3: calc(var(--typewriter-phi) * var(--typewriter-u2));
        --typewriter-u4: calc(var(--typewriter-phi) * var(--typewriter-u3));

        --typewriter-bg: light-dark(rgb(255, 255, 255), rgb(26, 26, 26));
        --typewriter-text: light-dark(rgb(69, 69, 69), rgb(186, 186, 186));
        --typewriter-text-muted: light-dark(
          rgb(92, 92, 92),
          rgb(154, 151, 144)
        );
        --typewriter-line: light-dark(rgb(201, 196, 184), rgb(58, 56, 52));
        --typewriter-line-soft: color-mix(
          in srgb,
          var(--typewriter-line) 50%,
          transparent
        );

        --typewriter-font-mono:
          "SF Mono", "Menlo", "Monaco", "Consolas", "Liberation Mono",
          "Courier New", monospace;
        --typewriter-font-ui:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

        /* Horizontal & vertical rhythm from φ (100/φ ≈ 61.8 ch) */
        --typewriter-max-width: calc(100 / var(--typewriter-phi) * 1ch);
        --typewriter-margin: var(--typewriter-u3);
        --typewriter-line-height: var(--typewriter-phi);
        --typewriter-radius: var(--typewriter-u0);

        /* Fixed controls, top-right corner */
        --typewriter-control-size: var(--typewriter-u3);
        --typewriter-control-gap: calc(
          var(--typewriter-u0) / var(--typewriter-phi)
        );

        --typewriter-z-shortcuts: 1;
        --typewriter-z-controls: 2;

        /* Focus outline (a11y) */
        --typewriter-focus-outline: 2px solid var(--typewriter-text);
        --typewriter-focus-outline-offset: 2px;

        --typewriter-transition-1: 0.15s;
        --typewriter-transition-2: calc(
          var(--typewriter-transition-1) * var(--typewriter-phi)
        );
      }

      :root[data-theme="light"] {
        color-scheme: light;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }

      html,
      body {
        min-height: 100%;
        background: var(--typewriter-bg);
        color: var(--typewriter-text);
        font-family: var(--typewriter-font-mono);
        font-size: var(--typewriter-u1);
        line-height: var(--typewriter-line-height);
        -webkit-font-smoothing: antialiased;
      }

      :focus-visible {
        outline: var(--typewriter-focus-outline);
        outline-offset: var(--typewriter-focus-outline-offset);
      }

      .typewriter-app {
        height: 100dvh;
        padding: 0 var(--typewriter-margin);
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: hidden;
      }

      .typewriter-page {
        width: 100%;
        max-width: var(--typewriter-max-width);
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      typewriter-editor {
        position: relative;
        display: block;
        flex: 1;
        min-height: 0;
        overflow: auto;
        outline: none;
        padding-block: var(--typewriter-u3);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        scrollbar-width: none;
      }

      typewriter-editor:focus-visible {
        outline: none;
      }

      typewriter-editor::-webkit-scrollbar {
        display: none;
      }

      /* Absolutely positioned so the caret is not pushed after it */
      typewriter-editor.is-empty::before {
        position: absolute;
        content: attr(aria-placeholder);
        color: var(--typewriter-text-muted);
        pointer-events: none;
      }

      typewriter-footer {
        flex-shrink: 0;
        padding-block: var(--typewriter-u2);
        border-top: 1px solid var(--typewriter-line-soft);
        background: var(--typewriter-bg);
        font-family: var(--typewriter-font-ui);
        font-size: var(--typewriter-u0);
        color: var(--typewriter-text-muted);
        display: flex;
        justify-content: space-between;
        align-items: center;
        text-transform: uppercase;
      }

      typewriter-shortcuts {
        position: fixed;
        right: 0;
        bottom: 0;
        z-index: var(--typewriter-z-shortcuts);
      }

      .typewriter-shortcuts__hotzone {
        display: block;
        width: var(--typewriter-u3);
        height: var(--typewriter-u3);
        border: none;
        background: transparent;
        cursor: pointer;
        appearance: none;
      }

      .typewriter-shortcuts__panel {
        /* Reset the UA popover centering, anchor bottom-right */
        inset: auto var(--typewriter-u2) var(--typewriter-u2) auto;
        margin: 0;
        padding: var(--typewriter-u2);
        max-width: calc(var(--typewriter-u4) * 4);
        border: 1px solid var(--typewriter-line-soft);
        border-radius: var(--typewriter-radius);
        background: var(--typewriter-bg);
        color: var(--typewriter-text);
        font-family: var(--typewriter-font-ui);
        font-size: var(--typewriter-u0);
        opacity: 0;
        translate: 0 var(--typewriter-u0);
        transition:
          opacity var(--typewriter-transition-1),
          translate var(--typewriter-transition-1),
          display var(--typewriter-transition-1) allow-discrete,
          overlay var(--typewriter-transition-1) allow-discrete;
      }

      .typewriter-shortcuts__panel:popover-open {
        opacity: 1;
        translate: 0 0;

        @starting-style {
          opacity: 0;
          translate: 0 var(--typewriter-u0);
        }
      }

      .typewriter-shortcuts__title {
        font-weight: 600;
        margin-bottom: var(--typewriter-u0);
        color: var(--typewriter-text-muted);
      }

      .typewriter-shortcuts__table {
        width: 100%;
        border-collapse: collapse;
      }

      .typewriter-shortcuts__table td {
        padding-top: var(--typewriter-u1);
        vertical-align: baseline;
      }

      .typewriter-shortcuts__table tr:first-child td {
        padding-top: 0;
      }

      .typewriter-shortcuts__keys {
        padding-right: var(--typewriter-u2);
        white-space: nowrap;
      }

      .typewriter-shortcuts__table kbd {
        font-family: var(--typewriter-font-mono);
        font-size: calc(var(--typewriter-u0) / var(--typewriter-phi));
        padding: calc(var(--typewriter-u1) / 16) var(--typewriter-u0);
        border-radius: var(--typewriter-radius);
        border: 1px solid var(--typewriter-line);
      }

      .typewriter-controls {
        position: fixed;
        top: var(--typewriter-u2);
        right: var(--typewriter-u2);
        z-index: var(--typewriter-z-controls);
        display: flex;
        gap: var(--typewriter-control-gap);
      }

      .typewriter-controls :is(a, button) {
        width: var(--typewriter-control-size);
        height: var(--typewriter-control-size);
        border: 1px solid var(--typewriter-line);
        border-radius: var(--typewriter-radius);
        background: var(--typewriter-bg);
        color: var(--typewriter-text);
        cursor: pointer;
        /* Buttons don't inherit the page font, links do: set it for both */
        font-family: var(--typewriter-font-ui);
        font-size: var(--typewriter-u1);
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.5;
        transition: opacity var(--typewriter-transition-1);
      }

      .typewriter-controls :is(a, button):hover,
      .typewriter-controls :is(a, button):focus-visible {
        opacity: 1;
      }

      /* Distraction-free: hide the UI (kept out of tab order), keep the footer rule */
      typewriter-footer > *,
      typewriter-shortcuts,
      typewriter-export,
      typewriter-theme-toggle {
        transition:
          opacity var(--typewriter-transition-2),
          visibility var(--typewriter-transition-2);
      }

      :root[data-distraction-free] {
        typewriter-footer > *,
        typewriter-shortcuts,
        typewriter-export,
        typewriter-theme-toggle {
          opacity: 0;
          visibility: hidden;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        ::before,
        ::after {
          transition-duration: 0s !important;
        }
      }

      @media print {
        @page {
          margin: 2.5cm;
        }

        :root {
          color-scheme: light;
        }

        html,
        body {
          background: rgb(255, 255, 255);
          color: rgb(0, 0, 0);
          print-color-adjust: exact;
        }

        .typewriter-app {
          height: auto;
          padding: 0;
          overflow: visible;
        }

        .typewriter-page {
          max-width: none;
          flex: none;
        }

        typewriter-editor {
          flex: none;
          overflow: visible;
          padding-block: 0;
          font-size: 12pt;
        }

        typewriter-editor.is-empty::before {
          content: none;
        }

        typewriter-footer,
        typewriter-shortcuts,
        .typewriter-controls {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="typewriter-app">
      <main class="typewriter-page">
        <typewriter-editor
          id="typewriter-editor"
          class="is-empty"
          aria-placeholder="Commencez à écrire…"
          role="textbox"
          aria-multiline="true"
          aria-label="Zone d’écriture"
        ></typewriter-editor>
        <typewriter-footer>
          <span class="js-typewriter-count">0 mot</span>
          <span class="js-typewriter-saved" role="status"></span>
        </typewriter-footer>
      </main>
    </div>

    <typewriter-shortcuts>
      <button
        type="button"
        class="typewriter-shortcuts__hotzone"
        aria-label="Raccourcis clavier"
        popovertarget="typewriter-shortcuts-panel"
        popovertargetaction="show"
      ></button>
      <div
        class="typewriter-shortcuts__panel"
        id="typewriter-shortcuts-panel"
        popover
      >
        <div class="typewriter-shortcuts__title">Raccourcis</div>
        <table class="typewriter-shortcuts__table">
          <caption class="sr-only">
            Liste des raccourcis clavier
          </caption>
          <thead>
            <tr>
              <th scope="col" class="sr-only">Raccourci</th>
              <th scope="col" class="sr-only">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="typewriter-shortcuts__keys">
                <kbd class="js-typewriter-mod">Ctrl</kbd> + <kbd>S</kbd>
              </td>
              <td>Enregistrer</td>
            </tr>
            <tr>
              <td class="typewriter-shortcuts__keys">
                <kbd class="js-typewriter-mod">Ctrl</kbd> + <kbd>K</kbd>
              </td>
              <td>Thème clair/sombre</td>
            </tr>
            <tr>
              <td class="typewriter-shortcuts__keys"><kbd>Échap</kbd></td>
              <td>Quitter le mode sans distraction</td>
            </tr>
          </tbody>
        </table>
      </div>
    </typewriter-shortcuts>

    <div class="typewriter-controls">
      <typewriter-export for="typewriter-editor">
        <a
          href="#"
          download="typewriter.txt"
          aria-label="Exporter en .txt"
          title="Exporter en .txt"
          >⤓</a
        >
      </typewriter-export>
      <typewriter-theme-toggle>
        <button
          type="button"
          aria-label="Thème sombre"
          title="Thème clair/sombre"
        ></button>
      </typewriter-theme-toggle>
      <typewriter-distraction-toggle>
        <button
          type="button"
          aria-label="Mode sans distraction"
          title="Mode sans distraction (Échap pour quitter)"
        >
          ⊙
        </button>
      </typewriter-distraction-toggle>
    </div>

    <script type="module">
      const STORAGE_KEY = "typewriter-store";
      const SAVE_DEBOUNCE_MS = 400;
      const SAVED_VISIBLE_MS = 1200;
      const SHORTCUTS_HIDE_DELAY_MS = 150;
      const SCROLL_AT_BOTTOM_THRESHOLD_PX = 10;

      const $root = document.documentElement;
      const isMac = /mac|iphone|ipad/i.test(
        navigator.userAgentData?.platform ?? navigator.platform,
      );
      const darkQuery = matchMedia("(prefers-color-scheme: dark)");
      const segmenter = new Intl.Segmenter($root.lang || navigator.language, {
        granularity: "word",
      });

      function getWordCount(text) {
        let count = 0;
        for (const segment of segmenter.segment(text)) {
          if (segment.isWordLike) count++;
        }
        return count;
      }

      /** Local date as YYYY-MM-DD. */
      function getLocalDate() {
        const date = new Date();
        return [date.getFullYear(), date.getMonth() + 1, date.getDate()]
          .map(n => String(n).padStart(2, "0"))
          .join("-");
      }

      function getTheme() {
        return $root.dataset.theme ?? (darkQuery.matches ? "dark" : "light");
      }

      function isDistractionFree() {
        return "distractionFree" in $root.dataset;
      }

      class TypewriterEditorElement extends HTMLElement {
        #controller = null;
        #saveTimeout = null;
        #wasAtBottom = true;

        connectedCallback() {
          this.contentEditable = "plaintext-only";
          this.spellcheck = true;
          this.#controller = new AbortController();
          const { signal } = this.#controller;
          this.addEventListener("input", () => this.#handleInput(), {
            signal,
          });
          this.addEventListener("scroll", () => this.#updateWasAtBottom(), {
            signal,
          });
        }

        disconnectedCallback() {
          this.#controller?.abort();
          clearTimeout(this.#saveTimeout);
        }

        get text() {
          return this.innerText;
        }

        set text(value) {
          this.textContent = value ?? "";
          this.#updateEmpty(this.textContent);
        }

        scrollToBottom() {
          this.scrollTop = this.scrollHeight - this.clientHeight;
        }

        /** Cancels the pending debounced save and saves right away. */
        flush() {
          clearTimeout(this.#saveTimeout);
          this.#saveTimeout = null;
          this.#emitSave();
        }

        #updateWasAtBottom() {
          const maxScroll = this.scrollHeight - this.clientHeight;
          this.#wasAtBottom =
            this.scrollTop >= maxScroll - SCROLL_AT_BOTTOM_THRESHOLD_PX;
        }

        #updateEmpty(text) {
          // Browsers may leave a lone <br> (read as "\n") once everything is
          // deleted.
          this.classList.toggle("is-empty", /^\n*$/.test(text));
        }

        #emitSave() {
          this.dispatchEvent(
            new CustomEvent("typewriter-save", { bubbles: true }),
          );
        }

        #handleInput() {
          const text = this.text;
          this.#updateEmpty(text);
          this.dispatchEvent(
            new CustomEvent("typewriter-input", {
              bubbles: true,
              detail: { wordCount: getWordCount(text) },
            }),
          );
          clearTimeout(this.#saveTimeout);
          this.#saveTimeout = setTimeout(() => {
            this.#saveTimeout = null;
            this.#emitSave();
          }, SAVE_DEBOUNCE_MS);
          if (this.#wasAtBottom) this.scrollToBottom();
        }
      }
      customElements.define("typewriter-editor", TypewriterEditorElement);

      class TypewriterFooterElement extends HTMLElement {
        #$count = null;
        #$saved = null;
        #savedTimeout = null;

        connectedCallback() {
          this.#$count = this.querySelector(".js-typewriter-count");
          this.#$saved = this.querySelector(".js-typewriter-saved");
        }

        disconnectedCallback() {
          clearTimeout(this.#savedTimeout);
        }

        updateCount(wordCount) {
          this.#$count.textContent =
            wordCount === 1 ? "1 mot" : `${wordCount} mots`;
        }

        showSaved() {
          this.#$saved.textContent = "Enregistré";
          clearTimeout(this.#savedTimeout);
          this.#savedTimeout = setTimeout(() => {
            this.#$saved.textContent = "";
          }, SAVED_VISIBLE_MS);
        }
      }
      customElements.define("typewriter-footer", TypewriterFooterElement);

      /** Downloads the text of the editor referenced by `for` as a .txt file. */
      class TypewriterExportElement extends HTMLElement {
        #$link = null;
        #controller = null;
        #url = null;

        connectedCallback() {
          this.#$link = this.querySelector("a");
          this.#controller = new AbortController();
          const { signal } = this.#controller;
          // The href is filled in during the click, before the download starts.
          this.#$link.addEventListener("click", () => this.#prepare(), {
            signal,
          });
        }

        disconnectedCallback() {
          this.#controller?.abort();
          URL.revokeObjectURL(this.#url);
        }

        #prepare() {
          const $editor = document.getElementById(this.getAttribute("for"));
          const blob = new Blob([$editor.text], {
            type: "text/plain;charset=utf-8",
          });
          // Revoked on the next export, once the previous download is done.
          URL.revokeObjectURL(this.#url);
          this.#url = URL.createObjectURL(blob);
          this.#$link.href = this.#url;
          this.#$link.download = `typewriter-${getLocalDate()}.txt`;
        }
      }
      customElements.define("typewriter-export", TypewriterExportElement);

      class TypewriterThemeToggleElement extends HTMLElement {
        #$button = null;
        #controller = null;

        connectedCallback() {
          this.#$button = this.querySelector("button");
          this.#controller = new AbortController();
          const { signal } = this.#controller;
          this.#$button.addEventListener("click", () => this.toggle(), {
            signal,
          });
          darkQuery.addEventListener("change", () => this.#render(), {
            signal,
          });
          this.#render();
        }

        disconnectedCallback() {
          this.#controller?.abort();
        }

        toggle() {
          this.setTheme(getTheme() === "dark" ? "light" : "dark");
          this.dispatchEvent(
            new CustomEvent("typewriter-theme-change", {
              bubbles: true,
              detail: { theme: getTheme() },
            }),
          );
        }

        setTheme(theme) {
          if (theme === "light" || theme === "dark") {
            $root.dataset.theme = theme;
          } else {
            delete $root.dataset.theme;
          }
          this.#render();
        }

        #render() {
          const isDark = getTheme() === "dark";
          // U+FE0E forces text presentation (no emoji rendering).
          this.#$button.textContent = isDark ? "☀︎" : "☽︎";
          this.#$button.setAttribute("aria-pressed", String(isDark));
        }
      }
      customElements.define(
        "typewriter-theme-toggle",
        TypewriterThemeToggleElement,
      );

      class TypewriterShortcutsElement extends HTMLElement {
        #controller = null;
        #hideTimeout = null;

        connectedCallback() {
          const $panel = this.querySelector("[popover]");

          for (const $mod of this.querySelectorAll(".js-typewriter-mod")) {
            $mod.textContent = isMac ? "⌘" : "Ctrl";
          }

          this.#controller = new AbortController();
          const { signal } = this.#controller;

          // Hover is a mouse-only enhancement; touch and keyboard use the
          // native popovertarget (closed by Escape or light dismiss).
          this.addEventListener(
            "pointerenter",
            e => {
              if (e.pointerType !== "mouse") return;
              clearTimeout(this.#hideTimeout);
              if (!$panel.matches(":popover-open")) $panel.showPopover();
            },
            { signal },
          );
          this.addEventListener(
            "pointerleave",
            e => {
              if (e.pointerType !== "mouse") return;
              this.#hideTimeout = setTimeout(() => {
                if ($panel.matches(":popover-open")) $panel.hidePopover();
              }, SHORTCUTS_HIDE_DELAY_MS);
            },
            { signal },
          );
        }

        disconnectedCallback() {
          this.#controller?.abort();
          clearTimeout(this.#hideTimeout);
        }
      }
      customElements.define("typewriter-shortcuts", TypewriterShortcutsElement);

      class TypewriterDistractionToggleElement extends HTMLElement {
        #$button = null;
        #controller = null;

        connectedCallback() {
          this.#$button = this.querySelector("button");
          this.#controller = new AbortController();
          const { signal } = this.#controller;
          this.#$button.addEventListener("click", () => this.toggle(), {
            signal,
          });
          document.addEventListener(
            "keydown",
            e => {
              if (e.key === "Escape" && isDistractionFree()) this.toggle();
            },
            { signal },
          );
          this.#render();
        }

        disconnectedCallback() {
          this.#controller?.abort();
        }

        toggle() {
          this.setDistractionFree(!isDistractionFree());
          this.dispatchEvent(
            new CustomEvent("typewriter-distraction-change", {
              bubbles: true,
              detail: { distractionFree: isDistractionFree() },
            }),
          );
        }

        setDistractionFree(on) {
          $root.toggleAttribute("data-distraction-free", Boolean(on));
          this.#render();
        }

        #render() {
          this.#$button.setAttribute(
            "aria-pressed",
            String(isDistractionFree()),
          );
        }
      }
      customElements.define(
        "typewriter-distraction-toggle",
        TypewriterDistractionToggleElement,
      );

      function loadState() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY));
        } catch {
          return null;
        }
      }

      const $editor = document.querySelector("typewriter-editor");
      const $footer = document.querySelector("typewriter-footer");
      const $themeToggle = document.querySelector("typewriter-theme-toggle");
      const $distractionToggle = document.querySelector(
        "typewriter-distraction-toggle",
      );
      const $themeColor = document.querySelector('meta[name="theme-color"]');
      const $favicon = document.querySelector('link[rel="icon"]');

      function saveState() {
        try {
          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({
              text: $editor.text,
              theme: $root.dataset.theme ?? null,
              distractionFree: isDistractionFree(),
            }),
          );
        } catch {
          return;
        }
        $footer.showSaved();
      }

      function syncThemeMeta() {
        $themeColor.content = getComputedStyle(document.body).backgroundColor;
        $favicon.href =
          getTheme() === "dark" ? "favicon-dark.svg" : "favicon.svg";
      }

      function applyState(state, { scroll = false } = {}) {
        $themeToggle.setTheme(state?.theme);
        $distractionToggle.setDistractionFree(state?.distractionFree);
        $editor.text = state?.text ?? "";
        $footer.updateCount(getWordCount($editor.text));
        syncThemeMeta();
        if (scroll) requestAnimationFrame(() => $editor.scrollToBottom());
      }

      applyState(loadState(), { scroll: true });

      $editor.addEventListener("typewriter-input", e => {
        $footer.updateCount(e.detail.wordCount);
      });
      $editor.addEventListener("typewriter-save", saveState);
      $themeToggle.addEventListener("typewriter-theme-change", () => {
        syncThemeMeta();
        saveState();
      });
      $distractionToggle.addEventListener(
        "typewriter-distraction-change",
        saveState,
      );
      darkQuery.addEventListener("change", syncThemeMeta);

      // Never lose the last keystrokes when the tab is closed or hidden.
      addEventListener("pagehide", () => $editor.flush());
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") $editor.flush();
      });

      // Another tab wrote to the store: follow it while this one is in the
      // background, so returning here never overwrites newer text.
      addEventListener("storage", e => {
        if (e.key !== STORAGE_KEY || document.hasFocus()) return;
        applyState(loadState());
      });

      document.addEventListener("keydown", e => {
        const mod = isMac ? e.metaKey : e.ctrlKey;
        if (!mod || e.altKey || e.shiftKey) return;
        const key = e.key.toLowerCase();
        if (key === "s") {
          e.preventDefault();
          $editor.flush();
        } else if (key === "k") {
          e.preventDefault();
          $themeToggle.toggle();
        }
      });

      if (
        "serviceWorker" in navigator &&
        location.protocol.startsWith("http")
      ) {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      }
    </script>
  </body>
</html>
