<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="Une machine à écrire minimaliste dans le navigateur."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <title>Typewriter</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      :root {
        color-scheme: light dark;

        /* Golden ratio (φ) and derived scale */
        --typewriter-phi: 1.618034;
        --typewriter-u0: calc(var(--typewriter-u1) / var(--typewriter-phi));
        --typewriter-u1: 1rem;
        --typewriter-u2: calc(var(--typewriter-phi) * var(--typewriter-u1));
        --typewriter-u3: calc(var(--typewriter-phi) * var(--typewriter-u2));
        --typewriter-u4: calc(var(--typewriter-phi) * var(--typewriter-u3));

        --typewriter-bg: light-dark(rgb(255, 255, 255), rgb(26, 26, 26));
        --typewriter-text: light-dark(rgb(69, 69, 69), rgb(186, 186, 186));
        --typewriter-text-muted: light-dark(
          rgb(92, 92, 92),
          rgb(154, 151, 144)
        );
        --typewriter-line: light-dark(rgb(201, 196, 184), rgb(58, 56, 52));
        --typewriter-line-soft: color-mix(
          in srgb,
          var(--typewriter-line) 50%,
          transparent
        );

        --typewriter-font-mono:
          "SF Mono", "Menlo", "Monaco", "Consolas", "Liberation Mono",
          "Courier New", monospace;
        --typewriter-font-ui:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

        /* Horizontal & vertical rhythm from φ (100/φ ≈ 61.8 ch) */
        --typewriter-max-width: calc(100 / var(--typewriter-phi) * 1ch);
        --typewriter-margin: var(--typewriter-u3);
        --typewriter-line-height: var(--typewriter-phi);
        --typewriter-radius: var(--typewriter-u0);

        /* Fixed controls, top-right corner */
        --typewriter-control-size: var(--typewriter-u3);
        --typewriter-control-gap: calc(
          var(--typewriter-u0) / var(--typewriter-phi)
        );
        /* 1/φ ≈ 0.618: icons at rest keep a 3:1 contrast in both themes */
        --typewriter-control-opacity: calc(1 / var(--typewriter-phi));

        --typewriter-z-shortcuts: 1;
        --typewriter-z-controls: 2;

        /* Focus outline (a11y) */
        --typewriter-focus-outline: 2px solid var(--typewriter-text);
        --typewriter-focus-outline-offset: 2px;

        --typewriter-transition-1: 0.15s;
        --typewriter-transition-2: calc(
          var(--typewriter-transition-1) * var(--typewriter-phi)
        );
      }

      :root[data-theme="light"] {
        color-scheme: light;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }

      html,
      body {
        min-height: 100%;
        background: var(--typewriter-bg);
        color: var(--typewriter-text);
        font-family: var(--typewriter-font-mono);
        font-size: var(--typewriter-u1);
        line-height: var(--typewriter-line-height);
        -webkit-font-smoothing: antialiased;
      }

      :focus-visible {
        outline: var(--typewriter-focus-outline);
        outline-offset: var(--typewriter-focus-outline-offset);
      }

      .typewriter-app {
        height: 100dvh;
        padding: 0 var(--typewriter-margin);
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: hidden;
      }

      .typewriter-page {
        width: 100%;
        max-width: var(--typewriter-max-width);
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      typewriter-editor {
        position: relative;
        display: block;
        flex: 1;
        min-height: 0;
        overflow: auto;
        outline: none;
        padding-block: var(--typewriter-u3);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        scrollbar-width: none;
      }

      typewriter-editor:focus-visible {
        outline: none;
      }

      /* Absolutely positioned so the caret is not pushed after it */
      typewriter-editor:state(empty)::before {
        position: absolute;
        content: attr(aria-placeholder);
        color: var(--typewriter-text-muted);
        pointer-events: none;
      }

      .typewriter-footer {
        flex-shrink: 0;
        padding-block: var(--typewriter-u2);
        border-top: 1px solid var(--typewriter-line-soft);
        background: var(--typewriter-bg);
        font-family: var(--typewriter-font-ui);
        font-size: var(--typewriter-u0);
        color: var(--typewriter-text-muted);
        display: flex;
        justify-content: space-between;
        align-items: center;
        text-transform: uppercase;
      }

      typewriter-shortcuts {
        position: fixed;
        right: 0;
        bottom: 0;
        z-index: var(--typewriter-z-shortcuts);
      }

      .typewriter-shortcuts__hotzone {
        display: block;
        width: var(--typewriter-u3);
        height: var(--typewriter-u3);
        border: none;
        background: transparent;
        cursor: pointer;
        appearance: none;
      }

      .typewriter-shortcuts__panel {
        /* Reset the UA popover centering, anchor bottom-right */
        inset: auto var(--typewriter-u2) var(--typewriter-u2) auto;
        margin: 0;
        padding: var(--typewriter-u2);
        max-width: calc(var(--typewriter-u4) * 4);
        border: 1px solid var(--typewriter-line-soft);
        border-radius: var(--typewriter-radius);
        background: var(--typewriter-bg);
        color: var(--typewriter-text);
        font-family: var(--typewriter-font-ui);
        font-size: var(--typewriter-u0);
        opacity: 0;
        translate: 0 var(--typewriter-u0);
        transition:
          opacity var(--typewriter-transition-1),
          translate var(--typewriter-transition-1),
          display var(--typewriter-transition-1) allow-discrete,
          overlay var(--typewriter-transition-1) allow-discrete;
      }

      .typewriter-shortcuts__panel:popover-open {
        opacity: 1;
        translate: 0 0;

        @starting-style {
          opacity: 0;
          translate: 0 var(--typewriter-u0);
        }
      }

      .typewriter-shortcuts__title {
        font-weight: 600;
        margin-bottom: var(--typewriter-u0);
        color: var(--typewriter-text-muted);
      }

      .typewriter-shortcuts__table {
        width: 100%;
        border-collapse: collapse;
      }

      .typewriter-shortcuts__table td {
        padding-top: var(--typewriter-u1);
        vertical-align: baseline;
      }

      .typewriter-shortcuts__table tr:first-child td {
        padding-top: 0;
      }

      .typewriter-shortcuts__keys {
        padding-right: var(--typewriter-u2);
        white-space: nowrap;
      }

      .typewriter-shortcuts__table kbd {
        font-family: var(--typewriter-font-mono);
        font-size: calc(var(--typewriter-u0) / var(--typewriter-phi));
        padding: calc(var(--typewriter-u1) / 16) var(--typewriter-u0);
        border-radius: var(--typewriter-radius);
        border: 1px solid var(--typewriter-line);
      }

      .typewriter-controls {
        position: fixed;
        top: var(--typewriter-u2);
        right: var(--typewriter-u2);
        z-index: var(--typewriter-z-controls);
        display: flex;
        gap: var(--typewriter-control-gap);
      }

      .typewriter-controls :is(a, button) {
        width: var(--typewriter-control-size);
        height: var(--typewriter-control-size);
        border: 1px solid var(--typewriter-line);
        border-radius: var(--typewriter-radius);
        background: var(--typewriter-bg);
        color: var(--typewriter-text);
        cursor: pointer;
        /* Buttons don't inherit the page font, links do: set it for both */
        font-family: var(--typewriter-font-ui);
        font-size: var(--typewriter-u1);
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: var(--typewriter-control-opacity);
        transition: opacity var(--typewriter-transition-1);
      }

      .typewriter-controls :is(a, button):hover,
      .typewriter-controls :is(a, button):focus-visible {
        opacity: 1;
      }

      /* Distraction-free: hide the UI (kept out of tab order), keep the footer rule */
      .typewriter-footer > *,
      typewriter-shortcuts,
      typewriter-export,
      typewriter-theme-toggle {
        transition:
          opacity var(--typewriter-transition-2),
          visibility var(--typewriter-transition-2);
      }

      :root[data-distraction-free] {
        .typewriter-footer > *,
        typewriter-shortcuts,
        typewriter-export,
        typewriter-theme-toggle {
          opacity: 0;
          visibility: hidden;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        ::before,
        ::after {
          transition-duration: 0s !important;
        }
      }

      @media print {
        @page {
          margin: 2.5cm;
        }

        :root {
          color-scheme: light;
        }

        html,
        body {
          background: rgb(255, 255, 255);
          color: rgb(0, 0, 0);
          print-color-adjust: exact;
        }

        .typewriter-app {
          height: auto;
          padding: 0;
          overflow: visible;
        }

        .typewriter-page {
          max-width: none;
          flex: none;
        }

        typewriter-editor {
          flex: none;
          overflow: visible;
          padding-block: 0;
          font-size: 12pt;
        }

        typewriter-editor:state(empty)::before {
          content: none;
        }

        .typewriter-footer,
        typewriter-shortcuts,
        .typewriter-controls {
          display: none !important;
        }
      }
    </style>
    <script>
      "use strict";

      // The store lives on window and is created before the first paint:
      // the document takes its theme from it, without a flash of the wrong
      // one. The block keeps everything else out of the global scope.
      {
        const STORAGE_KEY = "typewriter-store";
        const SAVE_DEBOUNCE_MS = 400;

        const $root = document.documentElement;
        const $themeColor = document.querySelector('meta[name="theme-color"]');
        const $favicon = document.querySelector('link[rel="icon"]');
        const darkQuery = matchMedia("(prefers-color-scheme: dark)");

        /** Observable state: the part of @agencecinq/store used here. */
        class Store {
          #state;
          #listeners = new Set();

          constructor(initial) {
            this.#state = initial;
          }

          get() {
            return this.#state;
          }

          /** A function is called with the current state and returns the next one. */
          set(update) {
            const previous = this.#state;
            const next =
              typeof update === "function" ? update(previous) : update;

            if (Object.is(next, previous)) return;

            this.#state = next;
            this.#listeners.forEach(listener => {
              try {
                listener(next, previous);
              } catch (error) {
                reportError(error);
              }
            });
          }

          /** Called on every change, not right away. Returns the unsubscribe function. */
          subscribe(listener) {
            this.#listeners.add(listener);

            return () => {
              this.#listeners.delete(listener);
            };
          }

          /**
           * Called right away with the selected slice, then only when it
           * changes. Returns the unsubscribe function.
           */
          select(selector, listener) {
            let value = selector(this.#state);

            listener(value);

            return this.subscribe(state => {
              const next = selector(state);

              if (Object.is(next, value)) return;

              value = next;
              listener(next);
            });
          }
        }

        /** What localStorage holds, checked: anything else falls back. */
        function load() {
          let saved = null;
          try {
            saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          } catch {}
          const theme = ["light", "dark"].includes(saved?.theme)
            ? saved.theme
            : null;
          return {
            text: typeof saved?.text === "string" ? saved.text : "",
            // The theme shown, and whether it was chosen over the system one.
            theme: theme ?? (darkQuery.matches ? "dark" : "light"),
            themeChosen: theme !== null,
            distractionFree: saved?.distractionFree === true,
          };
        }

        /**
         * The page state. Every brick reads and writes it, none knows the
         * others. `saved` is false while a change waits for localStorage.
         * `lastSave` is a new object on every save, so that two saves in a
         * row both notify, and tells whether the user asked for it.
         */
        class TypewriterStore extends Store {
          #saveTimeout = null;

          constructor() {
            super({ ...load(), saved: true, lastSave: null });

            darkQuery.addEventListener("change", ({ matches }) => {
              this.set(state =>
                state.themeChosen
                  ? state
                  : { ...state, theme: matches ? "dark" : "light" },
              );
            });

            // Never lose the last keystrokes when the tab is closed or hidden.
            addEventListener("pagehide", () => this.#write(false));
            document.addEventListener("visibilitychange", () => {
              if (document.visibilityState === "hidden") this.#write(false);
            });

            // Another tab saved: follow it, unless this one has changes of
            // its own waiting to be saved.
            addEventListener("storage", ({ key }) => {
              if (key !== STORAGE_KEY || !this.get().saved) return;
              this.set(state => ({ ...state, ...load() }));
            });
          }

          setText(text) {
            this.#change({ text });
          }

          toggleTheme() {
            const theme = this.get().theme === "dark" ? "light" : "dark";
            this.#change({ theme, themeChosen: true });
          }

          /** Like toggleAttribute(): `force` sets the mode instead. */
          toggleDistractionFree(force = !this.get().distractionFree) {
            this.#change({ distractionFree: force });
          }

          /** The user asks to save: written now, confirmed even with nothing pending. */
          save() {
            this.#write(true);
          }

          #write(manual) {
            clearTimeout(this.#saveTimeout);
            const { text, theme, themeChosen, distractionFree, saved } =
              this.get();
            if (saved && !manual) return;
            if (!saved) {
              try {
                localStorage.setItem(
                  STORAGE_KEY,
                  JSON.stringify({
                    text,
                    theme: themeChosen ? theme : null,
                    distractionFree,
                  }),
                );
              } catch {
                return;
              }
            }
            this.set(state => ({
              ...state,
              saved: true,
              lastSave: { manual },
            }));
          }

          #change(patch) {
            const state = this.get();
            if (Object.keys(patch).every(key => state[key] === patch[key])) {
              return;
            }
            this.set({ ...state, ...patch, saved: false });
            clearTimeout(this.#saveTimeout);
            this.#saveTimeout = setTimeout(
              () => this.#write(false),
              SAVE_DEBOUNCE_MS,
            );
          }
        }

        const store = new TypewriterStore();

        // The document follows the store: CSS reads these attributes.
        store.select(
          state => state.theme,
          theme => {
            $root.dataset.theme = theme;
            $themeColor.content = getComputedStyle($root).backgroundColor;
            $favicon.href =
              theme === "dark" ? "favicon-dark.svg" : "favicon.svg";
          },
        );
        store.select(
          state => state.distractionFree,
          distractionFree => {
            $root.toggleAttribute("data-distraction-free", distractionFree);
          },
        );

        window.store = store;
      }
    </script>
  </head>
  <body>
    <div class="typewriter-app">
      <main class="typewriter-page">
        <typewriter-editor
          aria-placeholder="Commencez à écrire…"
          role="textbox"
          aria-multiline="true"
          aria-label="Zone d’écriture"
        ></typewriter-editor>
        <footer class="typewriter-footer">
          <typewriter-word-count>0 mot</typewriter-word-count>
          <typewriter-save-status>
            <span aria-hidden="true"></span>
            <span class="sr-only" role="status"></span>
          </typewriter-save-status>
        </footer>
      </main>
    </div>

    <typewriter-shortcuts>
      <button
        type="button"
        class="typewriter-shortcuts__hotzone"
        aria-label="Raccourcis clavier"
        popovertarget="typewriter-shortcuts-panel"
        popovertargetaction="show"
      ></button>
      <div
        class="typewriter-shortcuts__panel"
        id="typewriter-shortcuts-panel"
        popover
      >
        <div class="typewriter-shortcuts__title">Raccourcis</div>
        <table class="typewriter-shortcuts__table">
          <caption class="sr-only">
            Liste des raccourcis clavier
          </caption>
          <thead>
            <tr>
              <th scope="col" class="sr-only">Raccourci</th>
              <th scope="col" class="sr-only">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="typewriter-shortcuts__keys">
                <kbd class="js-typewriter-mod">Ctrl</kbd> + <kbd>S</kbd>
              </td>
              <td>Enregistrer</td>
            </tr>
            <tr>
              <td class="typewriter-shortcuts__keys">
                <kbd class="js-typewriter-mod">Ctrl</kbd> + <kbd>K</kbd>
              </td>
              <td>Thème clair/sombre</td>
            </tr>
            <tr>
              <td class="typewriter-shortcuts__keys"><kbd>Échap</kbd></td>
              <td>Quitter le mode sans distraction</td>
            </tr>
          </tbody>
        </table>
      </div>
    </typewriter-shortcuts>

    <div class="typewriter-controls">
      <typewriter-export>
        <a
          href="#"
          download="typewriter.txt"
          aria-label="Exporter en .txt"
          title="Exporter en .txt"
          >⤓</a
        >
      </typewriter-export>
      <typewriter-theme-toggle>
        <button
          type="button"
          aria-label="Thème sombre"
          title="Thème clair/sombre"
        ></button>
      </typewriter-theme-toggle>
      <typewriter-distraction-free-toggle>
        <button
          type="button"
          aria-label="Mode sans distraction"
          title="Mode sans distraction (Échap pour quitter)"
        >
          ⊙
        </button>
      </typewriter-distraction-free-toggle>
    </div>

    <script type="module">
      const { store } = window;

      const SAVE_STATUS_HIDE_DELAY_MS = 1200;
      const SHORTCUTS_HIDE_DELAY_MS = 150;
      const SCROLL_AT_BOTTOM_THRESHOLD_PX = 10;

      const { lang } = document.documentElement;
      const isMac = /mac|iphone|ipad/i.test(
        navigator.userAgentData?.platform ?? navigator.platform,
      );
      const segmenter = new Intl.Segmenter(lang, { granularity: "word" });
      const pluralRules = new Intl.PluralRules(lang);
      const numberFormat = new Intl.NumberFormat(lang);

      function getWordCount(text) {
        let count = 0;
        for (const segment of segmenter.segment(text)) {
          if (segment.isWordLike) count++;
        }
        return count;
      }

      /** Local date as YYYY-MM-DD. */
      function getLocalDate() {
        const date = new Date();
        return [date.getFullYear(), date.getMonth() + 1, date.getDate()]
          .map(n => String(n).padStart(2, "0"))
          .join("-");
      }

      class TypewriterEditorElement extends HTMLElement {
        #controller = null;
        #internals = this.attachInternals();
        #text = "";
        #wasAtBottom = true;

        connectedCallback() {
          this.contentEditable = "plaintext-only";
          this.spellcheck = true;
          this.#controller = new AbortController();
          const { signal } = this.#controller;

          this.addEventListener(
            "input",
            () => {
              this.#text = this.innerText;
              store.setText(this.#text);
              if (this.#wasAtBottom) this.scrollTop = this.scrollHeight;
            },
            { signal },
          );
          this.addEventListener(
            "scroll",
            () => {
              const maxScroll = this.scrollHeight - this.clientHeight;
              this.#wasAtBottom =
                this.scrollTop >= maxScroll - SCROLL_AT_BOTTOM_THRESHOLD_PX;
            },
            { signal },
          );

          // select() returns the unsubscribe function: abort() calls it.
          signal.addEventListener(
            "abort",
            store.select(
              state => state.text,
              text => {
                // The text this editor just wrote comes back as is: only
                // another tab rewrites the DOM.
                if (text !== this.#text) {
                  this.#text = text;
                  this.textContent = text;
                }
                // Browsers may leave a lone <br> (read as "\n") once
                // everything is deleted.
                if (/^\n*$/.test(text)) this.#internals.states.add("empty");
                else this.#internals.states.delete("empty");
              },
            ),
          );

          requestAnimationFrame(() => (this.scrollTop = this.scrollHeight));
        }

        disconnectedCallback() {
          this.#controller?.abort();
        }
      }
      customElements.define("typewriter-editor", TypewriterEditorElement);

      class TypewriterWordCountElement extends HTMLElement {
        #controller = null;

        connectedCallback() {
          this.#controller = new AbortController();
          const { signal } = this.#controller;
          signal.addEventListener(
            "abort",
            store.select(
              state => state.text,
              text => {
                const count = getWordCount(text);
                // French: 0 and 1 are both "one" (0 mot, 1 mot, 2 mots).
                const word =
                  pluralRules.select(count) === "one" ? "mot" : "mots";
                this.textContent = `${numberFormat.format(count)} ${word}`;
              },
            ),
          );
        }

        disconnectedCallback() {
          this.#controller?.abort();
        }
      }
      customElements.define(
        "typewriter-word-count",
        TypewriterWordCountElement,
      );

      class TypewriterSaveStatusElement extends HTMLElement {
        #controller = null;
        #hideTimeout = null;

        connectedCallback() {
          const $text = this.querySelector("[aria-hidden]");
          const $status = this.querySelector('[role="status"]');
          this.#controller = new AbortController();
          const { signal } = this.#controller;
          signal.addEventListener(
            "abort",
            store.subscribe(({ lastSave }, previous) => {
              if (lastSave === previous.lastSave) return;
              $text.textContent = "Enregistré";
              // Every pause in the typing saves: only a save the user asked
              // for is read aloud.
              if (lastSave.manual) $status.textContent = "Enregistré";
              clearTimeout(this.#hideTimeout);
              this.#hideTimeout = setTimeout(() => {
                $text.textContent = "";
                $status.textContent = "";
              }, SAVE_STATUS_HIDE_DELAY_MS);
            }),
          );
        }

        disconnectedCallback() {
          this.#controller?.abort();
          clearTimeout(this.#hideTimeout);
        }
      }
      customElements.define(
        "typewriter-save-status",
        TypewriterSaveStatusElement,
      );

      /** Downloads the text as a dated .txt file. */
      class TypewriterExportElement extends HTMLElement {
        #controller = null;
        #url = null;

        connectedCallback() {
          const $link = this.querySelector("a");
          this.#controller = new AbortController();
          const { signal } = this.#controller;
          // The href is filled in during the click, before the download starts.
          $link.addEventListener(
            "click",
            () => {
              const blob = new Blob([store.get().text], {
                type: "text/plain;charset=utf-8",
              });
              // Revoked on the next export, once the previous download is done.
              URL.revokeObjectURL(this.#url);
              this.#url = URL.createObjectURL(blob);
              $link.href = this.#url;
              $link.download = `typewriter-${getLocalDate()}.txt`;
            },
            { signal },
          );
        }

        disconnectedCallback() {
          this.#controller?.abort();
          URL.revokeObjectURL(this.#url);
        }
      }
      customElements.define("typewriter-export", TypewriterExportElement);

      class TypewriterThemeToggleElement extends HTMLElement {
        #controller = null;

        connectedCallback() {
          const $button = this.querySelector("button");
          this.#controller = new AbortController();
          const { signal } = this.#controller;
          $button.addEventListener("click", () => store.toggleTheme(), {
            signal,
          });
          signal.addEventListener(
            "abort",
            store.select(
              state => state.theme,
              theme => {
                // U+FE0E forces text presentation (no emoji rendering).
                $button.textContent = theme === "dark" ? "☀︎" : "☽︎";
                $button.setAttribute("aria-pressed", String(theme === "dark"));
              },
            ),
          );
        }

        disconnectedCallback() {
          this.#controller?.abort();
        }
      }
      customElements.define(
        "typewriter-theme-toggle",
        TypewriterThemeToggleElement,
      );

      class TypewriterDistractionFreeToggleElement extends HTMLElement {
        #controller = null;

        connectedCallback() {
          const $button = this.querySelector("button");
          this.#controller = new AbortController();
          const { signal } = this.#controller;
          $button.addEventListener(
            "click",
            () => store.toggleDistractionFree(),
            { signal },
          );
          signal.addEventListener(
            "abort",
            store.select(
              state => state.distractionFree,
              distractionFree => {
                $button.setAttribute("aria-pressed", String(distractionFree));
              },
            ),
          );
        }

        disconnectedCallback() {
          this.#controller?.abort();
        }
      }
      customElements.define(
        "typewriter-distraction-free-toggle",
        TypewriterDistractionFreeToggleElement,
      );

      /** Lists the keyboard shortcuts, and handles them. */
      class TypewriterShortcutsElement extends HTMLElement {
        #controller = null;
        #hideTimeout = null;

        connectedCallback() {
          const $panel = this.querySelector("[popover]");

          for (const $mod of this.querySelectorAll(".js-typewriter-mod")) {
            $mod.textContent = isMac ? "⌘" : "Ctrl";
          }

          this.#controller = new AbortController();
          const { signal } = this.#controller;

          document.addEventListener(
            "keydown",
            e => {
              if (e.key === "Escape") {
                store.toggleDistractionFree(false);
                return;
              }
              const mod = isMac ? e.metaKey : e.ctrlKey;
              if (!mod || e.altKey || e.shiftKey) return;
              const key = e.key.toLowerCase();
              if (key === "s") {
                e.preventDefault();
                store.save();
              } else if (key === "k") {
                e.preventDefault();
                store.toggleTheme();
              }
            },
            { signal },
          );

          // Hover is a mouse-only enhancement; touch and keyboard use the
          // native popovertarget (closed by Escape or light dismiss).
          this.addEventListener(
            "pointerenter",
            e => {
              if (e.pointerType !== "mouse") return;
              clearTimeout(this.#hideTimeout);
              if (!$panel.matches(":popover-open")) $panel.showPopover();
            },
            { signal },
          );
          this.addEventListener(
            "pointerleave",
            e => {
              if (e.pointerType !== "mouse") return;
              this.#hideTimeout = setTimeout(() => {
                if ($panel.matches(":popover-open")) $panel.hidePopover();
              }, SHORTCUTS_HIDE_DELAY_MS);
            },
            { signal },
          );
        }

        disconnectedCallback() {
          this.#controller?.abort();
          clearTimeout(this.#hideTimeout);
        }
      }
      customElements.define("typewriter-shortcuts", TypewriterShortcutsElement);

      if (
        "serviceWorker" in navigator &&
        location.protocol.startsWith("http")
      ) {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      }
    </script>
  </body>
